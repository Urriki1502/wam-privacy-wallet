[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-privacy-wallet"
version = "0.0.0"
description = "Cross-platform WAM Privacy Wallet (foundation scaffold only)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[tool.setuptools.packages.find]
where = ["src"]
