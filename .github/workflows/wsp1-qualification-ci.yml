name: WSP-1 Pinned Engine Qualification CI (non-production)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wsp1:
    name: WSP-1 provenance / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout wallet application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact pinned WSP-1 revision
        run: |
          python -m pip install "git+https://github.com/Urriki1502/wam-silent-payments.git@ac55f13423620252bdbf848c7e8a280c3b84721e"

      - name: Verify third-party dependency consistency
        run: python -m pip check

      - name: Verify application syntax
        run: python -m compileall -q src tests

      - name: Verify WSP-1 provenance and read-only protocol metadata
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_wsp1_contract.py -v
