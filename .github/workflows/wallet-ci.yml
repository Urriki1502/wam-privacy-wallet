# Consolidated, non-production WAM Privacy Wallet CI.
# Preserves all eight offline contract suites on all four original architectures,
# full GUI/scaffold discovery on the original three x64 platforms,
# and the read-only WAM Core source-pin check. No WAM Core changes.
name: Wallet CI (offline contracts, GUI, and pinned Core)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only supersede outdated runs for the same PR; never cancel main-branch validation.
concurrency:
  group: wallet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-contracts:
    name: Offline contracts / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x86, bits: 32}
          - {os: windows-latest, arch: x64, bits: 64}
          - {os: macos-latest, arch: x64, bits: 64}
          - {os: ubuntu-latest, arch: x64, bits: 64}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 at the required architecture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Verify native Python pointer width
        id: architecture
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os
          import struct
          assert struct.calcsize('P') * 8 == int(os.environ['EXPECTED_BITS'])

      # Superset of the original per-workflow syntax checks.
      - name: Compile Python sources, tests, and tools
        run: python -m compileall -q src tests tools

      # Execute each old contract target in a separate process and report ALL
      # failing targets, rather than stopping the rest at the first failure.
      # Keep contracts dependency-free exactly as in the original dedicated workflows.
      - name: Run mandatory suites with fail-closed discovery
        env:
          PYTHONPATH: src
        run: python -m tools.ci_contract_gate

      # Preserve upstream raw Git blob bytes on Windows as well as Unix.
      - name: Disable CRLF conversion for exact-source research checkout
        run: git config --global core.autocrlf false

      - name: Checkout exact pinned privacy research source
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-privacy
          ref: db3d2dcaa540f1129d540101813b761167d33174
          path: .pinned-privacy
          persist-credentials: false

      - name: Native source-pinned network policy regressions (no transport)
        run: python tools/ci_pinned_network_policy.py .pinned-privacy

      - name: Native source-pinned PayJoin policy regressions (no signer)
        run: python tools/ci_pinned_network_policy.py .pinned-privacy --payjoin

      # Real detached GnuPG verification with an ephemeral synthetic test key.
      # This never runs WAM Core and never claims the official release is verified.
      - name: Verify GnuPG detached signatures with disposable test key (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          PYTHONPATH: src
        run: python -m tools.ci_native_gpg_e2e


  gui-tests:
    name: GUI + full test discovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0

      - name: Install GUI test dependencies
        run: python -m pip install -e ".[gui]"

      - name: Check GUI dependency consistency
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run fail-closed GUI and full test discovery
        run: python -m tools.gui_ci_contract_gate

  upstream-pinned-readonly:
    name: Verify pinned WAM Core source and current main (GET only)
    runs-on: ubuntu-latest
    needs: offline-contracts
    timeout-minutes: 8
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check exact upstream Core source bytes (GET only)
        env:
          PYTHONPATH: src
        run: python tools/check_core_source_pin.py --check-head
