# Inspect pinned WSP-1 source blobs, NEVER import/execute upstream Python.
name: WSP-1 Pinned Source API Review (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/wsp1-pinned-source-readonly.yml'
      - 'tools/wsp1_pinned_surface.py'
      - 'tests/test_wsp1_pinned_surface.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-wsp-source:
    name: Verify pinned WSP-1 API bytes and scanner RPC gap (NO EXEC)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout wallet only, without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exactly four public source blobs at reviewed SHA, no redirects
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SRC_ROOT="$(mktemp -d)"
          trap 'rm -rf -- "$SRC_ROOT"' EXIT
          COMMIT='ac55f13423620252bdbf848c7e8a280c3b84721e'
          for name in api scanner offline_signer backup; do
            install -d -m 0700 "$SRC_ROOT/src/wam_sp"
            curl --fail --silent --show-error --retry 0 \
              --max-time 30 --max-filesize 256000 \
              --proto '=https' --tlsv1.2 \
              --output "$SRC_ROOT/src/wam_sp/$name.py" \
              "https://raw.githubusercontent.com/Urriki1502/wam-silent-payments/$COMMIT/src/wam_sp/$name.py"
          done
          PYTHONPATH=src python -m tools.wsp1_pinned_surface \
            --source-root "$SRC_ROOT" > "$SRC_ROOT/report.json"
          python - "$SRC_ROOT/report.json" <<'PY'
          import json, pathlib, sys
          p = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if p.get("status") != "WSP1_PINNED_SOURCE_INSPECTED_NO_INTEGRATION":
              raise SystemExit("WSP_SOURCE_REVIEW_STATUS_DENIED")
          if p.get("upstream_commit_sha") != "ac55f13423620252bdbf848c7e8a280c3b84721e":
              raise SystemExit("WSP_SOURCE_COMMIT_MISMATCH")
          if p.get("source_files_verified") != 4:
              raise SystemExit("WSP_SOURCE_COUNT_DENIED")
          if p.get("wallet_read_rpc_missing") != [
              "getblock", "getrawmempool", "getrawtransaction"
          ] or p.get("scanner_attest_contract_unqualified") is not True:
              raise SystemExit("WSP_SCANNER_RPC_BOUNDARY_CHANGED")
          for k in ("scanner_enabled","signer_enabled","broadcast_allowed",
                    "mainnet_allowed","core_execution_allowed"):
              if p.get(k) is not False:
                  raise SystemExit("WSP_UPSTREAM_NOAUTH_REQUIRED")
          print("WSP_PINNED_API_SOURCE_GIT_BLOBS_VERIFIED")
          print("WSP_SCANNER_BRIDGE_BLOCKED_MISSING_READ_METHODS")
          print("WSP_SCANNER=false SIGNER=false BROADCAST=false MAINNET=false")
          PY
