name: Cross-Module Integration CI (non-production)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Full tests / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0

      - name: Install GUI package
        run: python -m pip install -e ".[gui]"

      - name: Install reviewed WSP-1 commit
        run: python -m pip install "git+https://github.com/Urriki1502/wam-silent-payments.git@ac55f13423620252bdbf848c7e8a280c3b84721e"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run all application tests together
        run: python -m unittest discover -s tests -v
