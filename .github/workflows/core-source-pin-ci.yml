name: WAM Core Source Pin Contract (read-only)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-source-contract:
    name: Source profile / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x86, bits: 32}
          - {os: windows-latest, arch: x64, bits: 64}
          - {os: macos-latest, arch: x64, bits: 64}
          - {os: ubuntu-latest, arch: x64, bits: 64}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Assert native Python architecture
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os
          import struct
          assert struct.calcsize("P") * 8 == int(os.environ["EXPECTED_BITS"])
      - name: Compile source and tests
        run: python -m compileall -q src/wam_privacy_wallet/node/core_source_pin.py tests/test_core_source_pin.py tools/check_core_source_pin.py
      - name: Run offline source-pin and negative contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_core_source_pin.py -v

  upstream-pinned-readonly:
    name: Verify pinned source and current Core main, read only
    runs-on: ubuntu-latest
    needs: core-source-contract
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and inspect exact Core source bytes (GET only)
        env:
          PYTHONPATH: src
        run: python tools/check_core_source_pin.py --check-head
