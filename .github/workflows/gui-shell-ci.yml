name: GUI Shell CI (non-production)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gui-shell:
    name: GUI smoke / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0

      - name: Install GUI test dependencies
        run: python -m pip install -e ".[gui]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run all scaffold and GUI tests
        run: python -m unittest discover -s tests -v
