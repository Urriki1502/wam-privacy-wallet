# Native pinned upstream WSP-1 Scanner.sync + local SYNTHETIC RPC integration.
# Not a real WAM Core node; no mainnet, signing, broadcast or real keys.
name: WSP-1 Native Scanner Synthetic Regtest (NO Core EXEC)

on:
  pull_request:
    paths:
      - '.github/workflows/wsp1-real-scanner-synthetic-regtest.yml'
      - 'tools/ci_wsp1_scanner_loopback.py'
      - 'tools/ci_wsp1_scanner_native_only.py'
      - 'tools/ci_wsp1_scanner_process_lock.py'
      - 'tools/ci_macos_scan_backup_native.py'
      - 'tests/test_macos_scan_backup_native.py'
      - 'tests/test_macos_encrypted_scan_backup.py'
      - 'src/wam_privacy_wallet/application/macos_encrypted_scan_backup.py'
      - 'src/wam_privacy_wallet/application/macos_private_directory.py'
      - 'tests/test_wsp1_scanner_process_lock.py'
      - 'tools/ci_qualified_scan_session.py'
      - 'src/wam_privacy_wallet/application/selected_history_export.py'
      - 'src/wam_privacy_wallet/gui/regtest_window.py'
      - 'tests/test_selected_history_export.py'
      - 'tests/test_regtest_gui.py'
      - 'tools/ci_regtest_manual_intent_native.py'
      - 'tools/ci_regtest_signed_psbt_review_native.py'
      - 'tools/ci_wsp_offline_signer_tty.py'
      - 'tools/wsp_offline_signer_seccomp.py'
      - 'tools/ci_wsp_offline_signer_seccomp_probe.py'
      - 'src/wam_privacy_wallet/application/offline_signed_psbt_review.py'
      - 'tools/review_regtest_signed_psbt.py'
      - 'tests/test_offline_signed_psbt_review.py'
      - 'src/wam_privacy_wallet/application/regtest_manual_intent.py'
      - 'tools/prepare_regtest_offline_intent.py'
      - 'tests/test_regtest_manual_intent.py'
      - 'src/wam_privacy_wallet/application/qualified_scan_session.py'
      - 'tests/test_qualified_scan_session.py'
      - 'src/wam_privacy_wallet/application/wsp_scan_coordinator.py'
      - 'src/wam_privacy_wallet/application/scan_only_account_session.py'
      - 'src/wam_privacy_wallet/application/encrypted_scan_backup.py'
      - 'src/wam_privacy_wallet/application/encrypted_checkpoint_archive.py'
      - 'src/wam_privacy_wallet/application/private_checkpoint_directory.py'
      - 'tests/test_private_checkpoint_directory.py'
      - 'src/wam_privacy_wallet/application/versioned_checkpoint_journal.py'
      - 'src/wam_privacy_wallet/application/checkpoint_metadata_auth.py'
      - 'tests/test_checkpoint_metadata_auth.py'
      - 'src/wam_privacy_wallet/application/snapshot_lineage_preflight.py'
      - 'tests/test_snapshot_lineage_preflight.py'
      - 'tests/test_versioned_checkpoint_journal.py'
      - 'src/wam_privacy_wallet/application/checkpoint_recovery_workflow.py'
      - 'tests/test_checkpoint_recovery_workflow.py'
      - 'tests/test_encrypted_checkpoint_archive.py'
      - 'src/wam_privacy_wallet/application/retained_scan_session.py'
      - 'tests/test_retained_scan_session.py'
      - 'tests/test_encrypted_scan_backup.py'
      - 'src/wam_privacy_wallet/application/scan_preview_workflow.py'
      - 'src/wam_privacy_wallet/gui/main_window.py'
      - 'tests/test_scan_preview_workflow.py'
      - 'tests/test_app_wsp_scan_coordinator.py'
      - 'tools/wsp1_pinned_surface.py'
      - 'src/wam_privacy_wallet/integrations/wsp1_source_review.py'
      - 'src/wam_privacy_wallet/integrations/wsp1_source_closure.py'
      - 'tools/wsp1_full_source_closure.py'
      - 'tests/test_wsp1_full_source_closure.py'
      - 'src/wam_privacy_wallet/integrations/wsp1_scanner_only_rpc.py'
      - 'src/wam_privacy_wallet/integrations/regtest_scanner_wire.py'
      - 'src/wam_privacy_wallet/application/live_regtest_scanner.py'
      - 'src/wam_privacy_wallet/node/read_rpc.py'
      - 'src/wam_privacy_wallet/node/rpc_json.py'
      - 'src/wam_privacy_wallet/node/core_readiness_rpc.py'
      - 'src/wam_privacy_wallet/node/basic_block_filter.py'
      - 'tests/test_core_readiness_rpc.py'
      - 'tests/test_basic_block_filter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-synthetic-scanner:
    name: Actual pinned WSP-1 Scanner.sync with local synthetic RPC (NO Core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout WAM Privacy Wallet (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout independently pinned WSP-1 source (read-only)
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-source
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Verify exact source commit and four pinned Git blobs BEFORE import
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(git -C wsp-source rev-parse HEAD)" = "ac55f13423620252bdbf848c7e8a280c3b84721e"
          python -m tools.wsp1_pinned_surface --source-root "$GITHUB_WORKSPACE/wsp-source" > /dev/null
          python -m tools.wsp1_full_source_closure --source-root "$GITHUB_WORKSPACE/wsp-source" > /dev/null
          echo "WSP1_PINNED_SOURCE_AND_IMPORT_CLOSURE_VERIFIED"

      - name: Install Linux Qt and kernel seccomp userspace library (no skip)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libseccomp2

      - name: Install only pinned experimental WSP-1 scanner runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ./wsp-source
          python -m pip install --disable-pip-version-check -e '.[gui]'
          python -m pip check

      - name: Actual source-qualified retained application session (public synthetic peer ONLY)
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
          QT_QPA_PLATFORM: offscreen
        run: python -B -m tools.ci_qualified_scan_session --source-root "$GITHUB_WORKSPACE/wsp-source"

      - name: Actual pinned WSP Wallet.propose and AES-GCM intent for external signer (synthetic chain peer ONLY)
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: python -B -m tools.ci_regtest_manual_intent_native --source-root "$GITHUB_WORKSPACE/wsp-source"

      - name: Kernel-seccomp network/exec-denied WSP signer CLI + signed PSBT review (SYNTHETIC CHAIN, NO Core)
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: python -B -m tools.ci_regtest_signed_psbt_review_native --source-root "$GITHUB_WORKSPACE/wsp-source"

      - name: Compile/test actual WSP-1 Scanner.sync against disposable loopback peer
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m py_compile tools/ci_wsp1_scanner_loopback.py src/wam_privacy_wallet/application/scan_preview_workflow.py
          python -m tools.ci_wsp1_scanner_loopback --source-root "$GITHUB_WORKSPACE/wsp-source"

  native-public-scanner-only:
    name: Actual pinned WSP-1 scanner-only / ${{ matrix.os }} / x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Preserve raw upstream Git blob bytes
        run: git config --global core.autocrlf false
      - name: Checkout wallet without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact immutable WSP source without credentials
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-source
          persist-credentials: false
      - name: Set up actual Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify full package source closure before installation/import
        env:
          PYTHONPATH: src
        run: python -B -m tools.wsp1_full_source_closure --source-root "${{ github.workspace }}/wsp-source"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install only pinned WSP dependencies and wallet GUI
        run: python -m pip install --disable-pip-version-check -e ./wsp-source -e ".[gui]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Retained application persistence remains unqualified on macOS and Windows
        if: runner.os != 'Linux'
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import sys
          from pathlib import Path
          from wam_privacy_wallet.application.qualified_scan_session import SourceQualifiedScanRuntime, QualifiedScanError
          try:
              SourceQualifiedScanRuntime(Path.cwd(), user_consented=True)
          except QualifiedScanError as error:
              assert str(error) == 'APP_QUALIFIED_SCAN_PLATFORM_UNQUALIFIED'
          else:
              raise AssertionError('unqualified retained persistence enabled')
          assert not any(name == 'wam_sp' or name.startswith('wam_sp.') for name in sys.modules)
          print('ACTUAL_NON_LINUX_RETAINED_SESSION_PLATFORM_DENIAL_ONLY')
      - name: Actual public BIP352 scanner, SQLite, reorg and Qt proof (NO Core)
        run: python -B -m tools.ci_wsp1_scanner_native_only --source-root "${{ github.workspace }}/wsp-source"
      - name: Actual native scanner inter-process lease, exit recovery and fresh attestation (NO Core)
        run: python -B -m tools.ci_wsp1_scanner_process_lock --source-root "${{ github.workspace }}/wsp-source"
      - name: Actual pinned scan-only AES-GCM through native macOS envelope custody (public fixtures)
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: src
        run: python -B -m tools.ci_macos_scan_backup_native --source-root "${{ github.workspace }}/wsp-source"

  win32-public-scanner-denial:
    name: Windows x86 WSP scanner UNQUALIFIED / denial only
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wallet without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up actual 32-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prove denial before source reads, WSP/Qt import or native execution
        shell: python
        env:
          PYTHONPATH: .;src
        run: |
          import struct, sys
          from pathlib import Path
          from unittest.mock import patch
          from tools.ci_wsp1_scanner_native_only import run
          assert struct.calcsize('P') == 4
          with patch('tools.ci_wsp1_scanner_native_only.verify_wsp1_full_source_closure') as source:
              try:
                  run(Path.cwd())
              except RuntimeError as error:
                  assert str(error) == 'WSP_NATIVE_PLATFORM_UNQUALIFIED'
              else:
                  raise AssertionError('unqualified scanner enabled')
              source.assert_not_called()
          assert not any(name.startswith('wam_sp') or name.startswith('PySide6') for name in sys.modules)
          from wam_privacy_wallet.application.qualified_scan_session import SourceQualifiedScanRuntime, QualifiedScanError
          try:
              SourceQualifiedScanRuntime(Path.cwd(), user_consented=True)
          except QualifiedScanError as error:
              assert str(error) == 'APP_QUALIFIED_SCAN_PLATFORM_UNQUALIFIED'
          else:
              raise AssertionError('unqualified retained persistence enabled')
          assert not any(name == 'wam_sp' or name.startswith('wam_sp.') for name in sys.modules)
          print('WINDOWS_X86_WSP_SCANNER_UNQUALIFIED_DENIAL_ONLY; not native scanner qualification')
