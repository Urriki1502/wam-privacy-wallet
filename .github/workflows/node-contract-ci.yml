name: Node Configuration Contract CI (non-production)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-contract:
    name: Local regtest endpoint / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q src tests
      - name: Verify local RPC configuration boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_node_contract.py -v
