name: Regtest Gateway CI (synthetic, non-production)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x86, bits: 32}
          - {os: windows-latest, arch: x64, bits: 64}
          - {os: macos-latest, arch: x64, bits: 64}
          - {os: ubuntu-latest, arch: x64, bits: 64}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12 for architecture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Validate native Python architecture
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os
          import struct
          assert struct.calcsize("P") * 8 == int(os.environ["EXPECTED_BITS"])
      - name: Compile all node modules
        run: python -m compileall -q src/wam_privacy_wallet/node tests/test_regtest_gateway.py
      - name: Run gateway over local synthetic HTTP server
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_regtest_gateway.py -v
