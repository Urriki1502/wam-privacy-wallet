name: Real Regtest Harness Contract CI (NO Core binary)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-contract:
    name: Harness-only / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x86, bits: 32}
          - {os: windows-latest, arch: x64, bits: 64}
          - {os: macos-latest, arch: x64, bits: 64}
          - {os: ubuntu-latest, arch: x64, bits: 64}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Assert native Python architecture
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os
          import struct
          assert struct.calcsize("P") * 8 == int(os.environ["EXPECTED_BITS"])
      - name: Compile harness modules
        run: python -m compileall -q src/wam_privacy_wallet/node/real_regtest.py tests/test_real_regtest_harness.py tools/verify_local_regtest.py
      - name: Test harness fail-closed with synthetic fixtures only
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_real_regtest_harness.py -v
