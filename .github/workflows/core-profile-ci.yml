name: WAM Core Regtest Profile CI (mocked Core RPC)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-profile:
    name: Core profile / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x86, bits: 32}
          - {os: windows-latest, arch: x64, bits: 64}
          - {os: macos-latest, arch: x64, bits: 64}
          - {os: ubuntu-latest, arch: x64, bits: 64}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Check actual Python architecture
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os
          import struct
          assert struct.calcsize("P") * 8 == int(os.environ["EXPECTED_BITS"])
      - name: Compile source
        run: python -m compileall -q src/wam_privacy_wallet/node tests/test_core_profile.py tests/test_read_rpc.py
      - name: Test Core profile and RPC request allowlist (mock only)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_core_profile.py -v
