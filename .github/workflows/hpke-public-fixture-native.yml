name: Pinned HPKE public fixture (NO Core/signer)

on:
  pull_request:
    paths:
      - '.github/workflows/hpke-public-fixture-native.yml'
      - 'native/hpke_readonly/**'
      - 'src/wam_privacy_wallet/application/selective_disclosure_review.py'
      - 'tools/package_public_hpke_fixture.py'
      - 'tools/ci_pinned_hpke_fixture.py'
      - 'tests/test_selective_disclosure_review.py'
      - 'src/wam_privacy_wallet/gui/main_window.py'
      - 'src/wam_privacy_wallet/application/presentation_lifecycle.py'
      - 'tests/test_gui_shell.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpke-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-hpke:
    name: Actual source-pinned HPKE public fixture / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu
            bits: 64
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            bits: 64
          - os: windows-latest
            arch: x86
            target: i686-pc-windows-msvc
            bits: 32
          - os: macos-latest
            arch: x64
            target: x86_64-apple-darwin
            bits: 64
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Preserve raw source Git blob bytes
        run: git config --global core.autocrlf false
      - name: Checkout wallet without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable privacy source without credentials
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-privacy
          ref: db3d2dcaa540f1129d540101813b761167d33174
          path: privacy-source
          persist-credentials: false
      - name: Install Rosetta for actual x64 execution on arm64 macOS
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Set up native Python 3.12 architecture
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install dependency-free wallet
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install Linux Qt runtime for actual source-to-GUI proof
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install Qt for qualified x64 GUI matrix only
        if: matrix.arch == 'x64'
        run: python -m pip install -e ".[gui]"
      - name: Verify actual native Python width
        shell: python
        env:
          EXPECTED_BITS: ${{ matrix.bits }}
        run: |
          import os, struct
          assert struct.calcsize('P') * 8 == int(os.environ['EXPECTED_BITS'])
      - name: Verify exact upstream blobs before build
        run: python -B -m tools.ci_pinned_hpke_fixture --verify-only --source-root "${{ github.workspace }}/privacy-source"
      - name: Install fixed official Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 ${{ matrix.target }}
      - name: Original unchanged upstream HPKE tests only (no Core or spend tests)
        run: cargo +1.99.0 test --locked --manifest-path privacy-source/prototypes/zk_balance_halo2/Cargo.toml --target ${{ matrix.target }} --test note_encryption
      - name: Own adapter tests against exact Git dependency and Cargo lock
        run: cargo +1.99.0 test --locked --manifest-path native/hpke_readonly/Cargo.toml --target ${{ matrix.target }}
      - name: Build own public-fixture worker from locked exact Git dependency
        run: cargo +1.99.0 build --release --locked --manifest-path native/hpke_readonly/Cargo.toml --target ${{ matrix.target }}
      - name: Package own build as unauthenticated experimental worker
        run: python -B tools/package_public_hpke_fixture.py ${{ matrix.target }}
      - name: Actual native x86 application receipt and adversarial tests (no Qt)
        if: matrix.arch == 'x86'
        run: python -B -m tools.ci_pinned_hpke_fixture --source-root "${{ github.workspace }}/privacy-source"
      - name: Actual native x64 application and Qt receipt tests (no mocks)
        if: matrix.arch == 'x64'
        run: python -B -m tools.ci_pinned_hpke_fixture --gui --source-root "${{ github.workspace }}/privacy-source"
