name: Pinned PSBTv2 native read-only review (NO signer/Core)

on:
  pull_request:
    paths:
      - '.github/workflows/psbt-v2-native-readonly.yml'
      - 'src/wam_privacy_wallet/application/psbt_v2_review.py'
      - 'src/wam_privacy_wallet/application/_psbt_v2_worker.py'
      - 'src/wam_privacy_wallet/integrations/wsp1_source_review.py'
      - 'src/wam_privacy_wallet/integrations/wsp1_source_closure.py'
      - 'tools/ci_pinned_psbt_v2.py'
      - 'tests/test_psbt_v2_review.py'
      - 'tests/test_psbt_v2_worker_boundary.py'
      - 'src/wam_privacy_wallet/gui/main_window.py'
      - 'src/wam_privacy_wallet/application/presentation_lifecycle.py'
      - 'tests/test_gui_shell.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psbt-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-unsigned-parser:
    name: Actual source-pinned unsigned PSBTv2 / ${{ matrix.os }} / x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Preserve raw source Git blob bytes
        run: git config --global core.autocrlf false
      - name: Checkout wallet without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable WSP source without credentials
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-source
          persist-credentials: false
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify full source closure before dependency installation/import
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import struct
          from pathlib import Path
          from wam_privacy_wallet.integrations.wsp1_source_closure import verify_wsp1_full_source_closure
          assert struct.calcsize('P') == 8
          verify_wsp1_full_source_closure(Path('wsp-source').resolve())
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install only exact pinned upstream dependencies and wallet
        run: python -m pip install --disable-pip-version-check -e ./wsp-source -e ".[gui]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Actual unsigned decoder and adversarial source-pinned tests
        run: python -B -m tools.ci_pinned_psbt_v2 --gui --source-root "${{ github.workspace }}/wsp-source"

  win32-parser-denial:
    name: Windows x86 parser UNQUALIFIED / denial only
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wallet without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up actual 32-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prove no parser child or dependency import on unqualified 32-bit
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import struct
          from pathlib import Path
          from unittest.mock import patch
          from wam_privacy_wallet.application.psbt_v2_review import review_synthetic_psbt_v2, PsbtV2ReviewError
          assert struct.calcsize('P') == 4
          with patch('subprocess.run') as child:
              try:
                  review_synthetic_psbt_v2(b'psbt\xff', source_root=Path.cwd(), scope='synthetic-regtest', consent=True)
              except PsbtV2ReviewError as exc:
                  assert str(exc) == 'APP_PSBT_V2_PLATFORM_UNQUALIFIED'
              else:
                  raise AssertionError('unqualified 32-bit parser was enabled')
              child.assert_not_called()
          print('WINDOWS_X86_PARSER_UNQUALIFIED_DENIAL_CONFIRMED; not native parser qualification')
